# 小白答疑 · 回粉丝模式的账号设置（模板）
#
# 复制一份，改名成 config.yaml，再把引号里的内容换成你自己的。
# 只有「回粉丝」模式需要它；小白自己来问的「自己问」模式不用填。
# 技能读不到 config.yaml 时会明说缺什么，不会拿模板里的值假装是你的设定。

account:
  name: "你的账号名"
  # 一句话：这个号主要帮谁。判断「这个粉丝是不是我要服务的人」靠它。
  positioning: "给<谁>讲<什么>"
  core_audience: "主要服务的人，具体到身份，例：有自己生意的小老板"
  side_audience: "次要的人，例：上班族、想搞副业的人、学生"
  # 回复里可以用的自我介绍。只用这几句，技能不会自己加。
  self_intro_allowed:
    - "一句你真做过、能拿出证据的事"
  # 回复里绝不出现的身份、头衔、信息
  self_intro_forbidden:
    - "任何收入金额"
    - "公司法定名称"

# 承接入口。空着 = 回复里不提任何付费的东西。
# 付费入口只在粉丝主动问「怎么跟你学」「有没有课」时提一句。
offers:
  free:
    - "主页置顶视频"
  paid: []          # 例：- "我的 AI 入门课"（填之前确认它还在卖）

redlines:
  banned_words: ["最", "第一", "唯一", "全网", "保证", "稳赚", "躺赚", "躺着赚"]
  money_word: "块"            # 公开场合说钱用「块」
  no_contact_in_public: true  # 评论区不留微信号、二维码、「私我」「加V」
  no_naming_creators: true    # 不点名其他博主
  no_income_promise: true     # 不承诺收益

voice:
  do: ["短句", "第一人称", "说人话", "不画饼", "可以自嘲"]
  dont: ["破折号", "首先其次总之", "连续三句排比", "英文直引号（用弯引号 “ ”）", "markdown 符号"]

paths:
  # 写电脑上的完整路径（Mac 例：/Users/你的用户名/粉丝回复）
  # 每一轮的回复稿存这里
  replies: "/完整路径/粉丝回复"
  # 每个粉丝一份聊天记录 + _总览.md
  chats: "/完整路径/粉丝回复/对话"
